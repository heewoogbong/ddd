<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>영상 공고 감시대</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root {
    --bg: #0a0c11;
    --panel: #12161f;
    --panel-hi: #171c28;
    --line: #242c3c;
    --line-soft: #1b2130;
    --text: #e8ecf4;
    --muted: #78849c;
    --dim: #4d5768;
    --accent: #5c7cff;
    --hot: #ff6a55;
    --fresh: #3fd69a;
    --amber: #f0a93b;
    --sans: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    letter-spacing: -0.011em; padding-bottom: 80px;
  }

  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1480px; margin: 0 auto; padding: 0 24px; }

  /* ---------- 헤더 ---------- */
  .masthead { padding: 40px 0 22px; border-bottom: 1px solid var(--line); }
  .eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--dim); margin: 0 0 10px;
  }
  .masthead h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.035em; }
  .stamp { margin-top: 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .tally { display: flex; flex-wrap: wrap; gap: 26px; margin-top: 20px; }
  .tally div { display: flex; align-items: baseline; gap: 7px; }
  .tally b { font-size: 25px; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .tally span { font-size: 12px; color: var(--muted); }
  .t-new b { color: var(--fresh); }
  .t-fresh b { color: var(--accent); }
  .t-hot b { color: var(--hot); }

  .howto {
    margin-top: 16px; font-size: 12.5px; color: var(--dim);
    display: flex; align-items: center; gap: 7px;
  }
  .howto b { color: var(--muted); font-weight: 600; }

  /* ---------- 필터 ---------- */
  .controls {
    position: sticky; top: 0; z-index: 20;
    background: rgba(10, 12, 17, 0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line-soft); padding: 13px 0;
  }
  .controls .wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  #q {
    flex: 1 1 220px; min-width: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); font-family: var(--sans); font-size: 14px; padding: 9px 13px;
  }
  #q::placeholder { color: var(--dim); }
  #q:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    background: none; border: 0; color: var(--muted); cursor: pointer;
    font-family: var(--sans); font-size: 13px; font-weight: 600;
    padding: 9px 13px; white-space: nowrap;
  }
  .seg button[aria-pressed="true"] { background: var(--panel-hi); color: var(--text); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ---------- 밴드 ---------- */
  .band {
    display: flex; align-items: center; gap: 12px; margin: 30px 0 13px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted);
  }
  .band::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }
  .band em { font-style: normal; color: var(--dim); font-weight: 500; font-variant-numeric: tabular-nums; }
  .band.urgent { color: var(--hot); }

  /* ---------- 카드 격자 ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 10px; }

  .card {
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line-soft); border-radius: 12px;
    padding: 14px 15px 12px;
    transition: border-color .16s ease, transform .16s ease;
  }
  .card:hover { border-color: var(--line); transform: translateY(-2px); }
  .card.read { opacity: 0.45; }

  .top { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 9px; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; min-width: 0; }

  .tag {
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
    padding: 2px 6px; border-radius: 4px;
    border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  }
  .tag.bid { border-color: rgba(92, 124, 255, .4); color: #93a8ff; }
  .tag.pre { border-color: rgba(240, 169, 59, .4); color: var(--amber); }
  .tag.new { border-color: rgba(63, 214, 154, .45); color: var(--fresh); }
  .tag.fresh { border-color: rgba(92, 124, 255, .5); color: #93a8ff; background: rgba(92, 124, 255, .08); }

  .star {
    background: none; border: 0; cursor: pointer; padding: 0 2px;
    font-size: 16px; line-height: 1; color: var(--dim);
  }
  .star:hover { color: var(--muted); }
  .star[aria-pressed="true"] { color: var(--amber); }
  .star:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  .title {
    display: -webkit-box; width: 100%; text-align: left;
    background: none; border: 0; padding: 0; cursor: pointer;
    font-family: var(--sans); font-size: 15px; font-weight: 700;
    letter-spacing: -0.022em; line-height: 1.4; color: var(--text);
    word-break: keep-all; margin-bottom: 8px;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .title:hover { color: #a8bcff; }
  .title:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }

  .org { font-size: 12.5px; color: var(--muted); margin-bottom: 3px; }
  .amt { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 7px; }
  .amt b { color: var(--text); font-weight: 700; }

  .no {
    background: none; border: 1px dashed var(--line); border-radius: 5px;
    color: var(--dim); cursor: pointer; align-self: flex-start;
    font-family: var(--mono); font-size: 11px; padding: 2px 7px;
  }
  .no:hover { color: var(--text); border-color: var(--muted); border-style: solid; }
  .no:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .foot {
    display: flex; align-items: center; gap: 8px;
    margin-top: auto; padding-top: 11px; border-top: 1px solid var(--line-soft);
  }

  .dday {
    font-size: 15px; font-weight: 800; letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums; color: var(--muted);
  }
  .card[data-heat="hot"] .dday { color: var(--hot); }
  .card[data-heat="warm"] .dday { color: var(--amber); }
  .card[data-heat="ok"] .dday { color: var(--text); }

  .clock { font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }

  .done {
    margin-left: auto;
    background: none; border: 1px solid var(--line); border-radius: 6px;
    color: var(--muted); cursor: pointer;
    font-family: var(--sans); font-size: 11.5px; font-weight: 600; padding: 4px 9px;
  }
  .done:hover { color: var(--text); border-color: var(--muted); }
  .done:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---------- 알림 ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: var(--panel-hi); border: 1px solid var(--line); border-radius: 9px;
    padding: 11px 18px; font-size: 13.5px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
    z-index: 50; box-shadow: 0 8px 24px rgba(0, 0, 0, .45); max-width: 90vw; text-align: center;
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  .empty { padding: 70px 0; text-align: center; color: var(--muted); }
  .empty p { margin: 0 0 6px; font-size: 15px; font-weight: 600; color: var(--text); }
  .empty small { font-size: 13px; }

  @media (max-width: 560px) {
    .wrap { padding: 0 16px; }
    .masthead { padding: 28px 0 18px; }
    .masthead h1 { font-size: 24px; }
    .grid { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <p class="eyebrow">나라장터 · 용역 + 사전규격</p>
    <h1>영상 공고 감시대</h1>
    <p class="stamp" id="stamp">불러오는 중…</p>
    <div class="tally">
      <div class="t-fresh"><b id="cFresh">0</b><span>최근 3일</span></div>
      <div class="t-new"><b id="cNew">0</b><span>안 읽음</span></div>
      <div class="t-hot"><b id="cHot">0</b><span>3일 내 마감</span></div>
      <div><b id="cLive">0</b><span>진행 중</span></div>
      <div><b id="cKeep">0</b><span>관심</span></div>
    </div>
    <p class="howto"><b>입찰공고</b>는 제목을 누르면 바로 열립니다. <b>사전규격</b>은 공고번호가 복사되니 나라장터 검색창에 붙여넣으세요.</p>
  </div>
</header>

<div class="controls">
  <div class="wrap">
    <input id="q" type="search" placeholder="공고명·기관 검색" autocomplete="off" />
    <div class="seg" id="fKind">
      <button data-v="all" aria-pressed="true">전체</button>
      <button data-v="bid" aria-pressed="false">입찰</button>
      <button data-v="prespec" aria-pressed="false">사전규격</button>
    </div>
    <div class="seg" id="fView">
      <button data-v="live" aria-pressed="true">진행 중</button>
      <button data-v="fresh" aria-pressed="false">신규</button>
      <button data-v="unread" aria-pressed="false">안 읽음</button>
      <button data-v="keep" aria-pressed="false">관심</button>
      <button data-v="all" aria-pressed="false">전부</button>
    </div>
    <div class="seg" id="fSort">
      <button data-v="close" aria-pressed="true">마감 임박순</button>
      <button data-v="far" aria-pressed="false">마감 늦은순</button>
      <button data-v="new" aria-pressed="false">최신 등록순</button>
      <button data-v="money" aria-pressed="false">금액 높은순</button>
    </div>
  </div>
</div>

<main class="wrap" id="list"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const KEY = "g2b-video-watch";
const G2B = "https://www.g2b.go.kr/";
const state = { kind: "all", view: "live", q: "", sort: "close" };
let notices = [];
let marks = load();

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(marks)); }
function mark(id) { return marks[id] || (marks[id] = {}); }

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 3200);
}

/* 나라장터 개편으로 예전 상세 주소는 모두 오류 페이지가 되었고,
   사전규격은 규격서 파일 주소가 딸려 옵니다. 그런 주소는 쓰지 않습니다. */
const DEAD = /(selectSubFrame|frameTgong|bidInfoDtl|fileDown|FileDown|download|\.(hwp|hwpx|pdf|zip|docx?|xlsx?|jpg|png)(\?|$))/i;

/* 개편된 나라장터의 입찰공고 상세 주소입니다.
   공고번호(R26BK01657206)와 차수(001)를 넣으면 바로 열립니다. */
function buildBidLink(n) {
  const raw = (n.no || "").trim();
  const m = raw.match(/^([A-Za-z0-9]+)-(\d+)$/);
  if (!m) return "";
  const ord = String(m[2]).padStart(3, "0");
  return `https://www.g2b.go.kr/link/PNPE027_01/single/?bidPbancNo=${m[1]}&bidPbancOrd=${ord}`;
}

function realLink(n) {
  // 입찰공고는 새 주소 형식으로 직접 조립해서 바로 연결합니다.
  if (n.kind !== "prespec") {
    const built = buildBidLink(n);
    if (built) return built;
  }
  // 사전규격은 아직 대응하는 주소가 없어 번호 복사로 넘어갑니다.
  const u = (n.url || "").trim();
  if (!u || !/^https?:\/\//i.test(u)) return "";
  if (/^https?:\/\/(www\.)?g2b\.go\.kr\/?$/i.test(u)) return "";
  if (DEAD.test(u)) return "";
  return u;
}

function bidNo(n) {
  return (n.no || "").trim();
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((res, rej) => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); res(); } catch (e) { rej(e); }
    document.body.removeChild(ta);
  });
}

function openNotice(n) {
  const link = realLink(n);
  if (link) { window.open(link, "_blank", "noopener"); return; }

  const no = bidNo(n);
  const win = window.open(G2B, "_blank", "noopener");
  copyText(no)
    .then(() => toast(`${no} 복사됨 · 나라장터 검색창에 붙여넣으세요`))
    .catch(() => toast(`공고번호 ${no} 로 나라장터에서 검색하세요`));
  return win;
}

function daysLeft(iso) {
  if (!iso) return null;
  const t = new Date(iso).getTime();
  if (isNaN(t)) return null;
  return Math.floor((t - Date.now()) / 86400000);
}

/* 등록된 지 3일 이내면 '신규'로 봅니다.
   posted_at(공고 게시일)이 없으면 처음 수집된 시각으로 판단합니다. */
const FRESH_DAYS = 3;

function isFresh(n) {
  const raw = n.posted_at || n.first_seen;
  if (!raw) return false;
  const t = new Date(raw).getTime();
  if (isNaN(t)) return false;
  return (Date.now() - t) <= FRESH_DAYS * 86400000;
}

function heat(d) {
  if (d === null) return "none";
  if (d < 0) return "dead";
  if (d <= 2) return "hot";
  if (d <= 6) return "warm";
  return "ok";
}

function money(w) {
  if (!w) return "";
  if (w >= 1e8) return (w / 1e8).toFixed(1).replace(/\.0$/, "") + "억원";
  return Math.round(w / 1e4).toLocaleString() + "만원";
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

/* 정렬 기준. close(기본)일 때만 마감 임박 그룹으로 묶어 보여줍니다. */
function ts(iso, fallback) {
  if (!iso) return fallback;
  const t = new Date(iso).getTime();
  return isNaN(t) ? fallback : t;
}

function sortRows(rows) {
  const arr = rows.slice();
  if (state.sort === "far") {
    // 마감일이 먼 것부터. 마감일 없는 건 맨 뒤로.
    arr.sort((a, b) => ts(b.close_at, -Infinity) - ts(a.close_at, -Infinity));
  } else if (state.sort === "new") {
    // 최근에 올라온 것부터.
    arr.sort((a, b) =>
      ts(b.posted_at || b.first_seen, 0) - ts(a.posted_at || a.first_seen, 0));
  } else if (state.sort === "money") {
    arr.sort((a, b) => (b.budget || 0) - (a.budget || 0));
  } else {
    // 마감 임박순. 마감일 없는 건 맨 뒤로.
    arr.sort((a, b) => ts(a.close_at, Infinity) - ts(b.close_at, Infinity));
  }
  return arr;
}

const BANDS = [
  { label: "오늘·내일 마감", test: d => d !== null && d >= 0 && d <= 1, urgent: true },
  { label: "이번 주 안에", test: d => d !== null && d >= 2 && d <= 6 },
  { label: "여유 있음", test: d => d !== null && d >= 7 },
  { label: "마감일 미표기", test: d => d === null },
  { label: "마감됨", test: d => d !== null && d < 0 },
];

function visible() {
  const q = state.q.trim().toLowerCase();
  return notices.filter(n => {
    const d = daysLeft(n.close_at);
    if (state.kind !== "all" && n.kind !== state.kind) return false;
    if (state.view === "live" && d !== null && d < 0) return false;
    if (state.view === "fresh" && !isFresh(n)) return false;
    if (state.view === "unread" && mark(n.id).read) return false;
    if (state.view === "keep" && !mark(n.id).keep) return false;
    if (q && !(n.title + n.org + n.no).toLowerCase().includes(q)) return false;
    return true;
  });
}

function card(n) {
  const d = daysLeft(n.close_at);
  const m = mark(n.id);
  const el = document.createElement("article");
  el.className = "card" + (m.read ? " read" : "");
  el.dataset.heat = heat(d);

  const dText = d === null ? "—" : d < 0 ? "마감" : "D-" + d;

  el.innerHTML = `
    <div class="top">
      <div class="tags">
        <span class="tag ${n.kind === "prespec" ? "pre" : "bid"}">${n.kind === "prespec" ? "사전규격" : "입찰공고"}</span>
        ${isFresh(n) ? '<span class="tag fresh">신규</span>' : ""}
        ${!m.read ? '<span class="tag new">안 읽음</span>' : ""}
        ${(n.hits || []).slice(0, 1).map(k => `<span class="tag">${k}</span>`).join("")}
      </div>
      <button class="star" data-act="keep" aria-pressed="${!!m.keep}" title="관심 등록">${m.keep ? "★" : "☆"}</button>
    </div>
    <button class="title" data-act="open">${n.title}</button>
    <div class="org">${n.org || "기관 미상"}</div>
    <div class="amt">${n.budget ? `<b>${money(n.budget)}</b>` : "금액 미공개"}${n.method ? " · " + n.method : ""}</div>
    <button class="no" data-act="copy" title="공고번호 복사">${bidNo(n)} ⧉</button>
    <div class="foot">
      <span class="dday">${dText}</span>
      <span class="clock">${fmtDate(n.close_at) || "마감일 미정"}</span>
      <button class="done" data-act="read">${m.read ? "되돌리기" : "읽음"}</button>
    </div>`;

  el.querySelector('[data-act="open"]').onclick = () => {
    if (!m.read) { m.read = true; save(); }
    openNotice(n);
    render();
  };
  el.querySelector('[data-act="copy"]').onclick = () => {
    const no = bidNo(n);
    copyText(no)
      .then(() => toast(`${no} 복사됨`))
      .catch(() => toast("복사에 실패했습니다"));
  };
  el.querySelector('[data-act="keep"]').onclick = () => { m.keep = !m.keep; save(); render(); };
  el.querySelector('[data-act="read"]').onclick = () => { m.read = !m.read; save(); render(); };
  return el;
}

function render() {
  const list = document.getElementById("list");
  list.textContent = "";
  const rows = visible();

  if (!rows.length) {
    list.innerHTML = `<div class="empty"><p>조건에 맞는 공고가 없습니다.</p>
      <small>검색어를 지우거나 필터를 '전부'로 바꿔보세요.</small></div>`;
  } else {
    const sorted = sortRows(rows);

    if (state.sort !== "close") {
      // 정렬을 바꾸면 마감 임박 그룹을 풀고 한 줄로 나열합니다.
      const label = { far: "마감 늦은순", new: "최신 등록순", money: "금액 높은순" }[state.sort];
      const h = document.createElement("div");
      h.className = "band";
      h.innerHTML = `${label} <em>${sorted.length}</em>`;
      list.appendChild(h);
      const g = document.createElement("div");
      g.className = "grid";
      sorted.forEach(n => g.appendChild(card(n)));
      list.appendChild(g);
    } else {
      BANDS.forEach(b => {
        const group = sorted.filter(n => b.test(daysLeft(n.close_at)));
        if (!group.length) return;
        const h = document.createElement("div");
        h.className = "band" + (b.urgent ? " urgent" : "");
        h.innerHTML = `${b.label} <em>${group.length}</em>`;
        list.appendChild(h);
        const g = document.createElement("div");
        g.className = "grid";
        group.forEach(n => g.appendChild(card(n)));
        list.appendChild(g);
      });
    }
  }

  const live = notices.filter(n => { const d = daysLeft(n.close_at); return d === null || d >= 0; });
  document.getElementById("cFresh").textContent = live.filter(isFresh).length;
  document.getElementById("cNew").textContent = live.filter(n => !mark(n.id).read).length;
  document.getElementById("cHot").textContent = live.filter(n => { const d = daysLeft(n.close_at); return d !== null && d <= 2; }).length;
  document.getElementById("cLive").textContent = live.length;
  document.getElementById("cKeep").textContent = notices.filter(n => mark(n.id).keep).length;
}

function wireSeg(id, field) {
  const box = document.getElementById(id);
  box.addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn) return;
    [...box.children].forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    state[field] = btn.dataset.v;

    // '신규' 탭을 누르면 최신 등록순으로 자동 전환합니다.
    if (field === "view" && btn.dataset.v === "fresh" && state.sort === "close") {
      state.sort = "new";
      const sortBox = document.getElementById("fSort");
      [...sortBox.children].forEach(b =>
        b.setAttribute("aria-pressed", String(b.dataset.v === "new")));
    }
    render();
  });
}
wireSeg("fKind", "kind");
wireSeg("fView", "view");
wireSeg("fSort", "sort");

document.getElementById("q").addEventListener("input", e => {
  state.q = e.target.value;
  render();
});

fetch("data/notices.json?v=" + Date.now())
  .then(r => r.json())
  .then(d => {
    notices = d.notices || [];
    document.getElementById("stamp").textContent =
      "마지막 수집 " + fmtDate(d.updated_at) + " · 누적 " + notices.length + "건";
    render();
  })
  .catch(() => {
    document.getElementById("stamp").textContent = "데이터를 불러오지 못했습니다";
    document.getElementById("list").innerHTML =
      `<div class="empty"><p>아직 수집된 공고가 없습니다.</p>
       <small>Actions 탭에서 '영상 공고 수집'을 한 번 실행해 주세요.</small></div>`;
  });
</script>
