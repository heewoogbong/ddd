<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>영상 공고 감시대</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  :root {
    --bg: #0a0c11;
    --panel: #12161f;
    --panel-hi: #171c28;
    --line: #242c3c;
    --line-soft: #1b2130;
    --text: #e8ecf4;
    --muted: #78849c;
    --dim: #4d5768;
    --accent: #5c7cff;
    --hot: #ff6a55;
    --fresh: #3fd69a;
    --amber: #f0a93b;
    --sans: "Pretendard Variable", Pretendard, -apple-system, system-ui, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    letter-spacing: -0.011em;
    padding-bottom: 80px;
  }

  a { color: inherit; text-decoration: none; }

  .wrap { max-width: 1480px; margin: 0 auto; padding: 0 24px; }

  /* ---------- 헤더 ---------- */
  .masthead { padding: 40px 0 22px; border-bottom: 1px solid var(--line); }

  .eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--dim); margin: 0 0 10px;
  }

  .masthead h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.035em; }

  .stamp { margin-top: 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .tally { display: flex; flex-wrap: wrap; gap: 26px; margin-top: 20px; }
  .tally div { display: flex; align-items: baseline; gap: 7px; }
  .tally b { font-size: 25px; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .tally span { font-size: 12px; color: var(--muted); }
  .t-new b { color: var(--fresh); }
  .t-hot b { color: var(--hot); }

  /* ---------- 필터 ---------- */
  .controls {
    position: sticky; top: 0; z-index: 20;
    background: rgba(10, 12, 17, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line-soft);
    padding: 13px 0;
  }

  .controls .wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  #q {
    flex: 1 1 220px; min-width: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); font-family: var(--sans); font-size: 14px; padding: 9px 13px;
  }
  #q::placeholder { color: var(--dim); }
  #q:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    background: none; border: 0; color: var(--muted); cursor: pointer;
    font-family: var(--sans); font-size: 13px; font-weight: 600;
    padding: 9px 13px; white-space: nowrap;
  }
  .seg button[aria-pressed="true"] { background: var(--panel-hi); color: var(--text); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  /* ---------- 밴드 ---------- */
  .band {
    display: flex; align-items: center; gap: 12px;
    margin: 30px 0 13px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted);
  }
  .band::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }
  .band em { font-style: normal; color: var(--dim); font-weight: 500; font-variant-numeric: tabular-nums; }
  .band.urgent { color: var(--hot); }

  /* ---------- 카드 격자 ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 10px;
  }

  .card {
    display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line-soft); border-radius: 12px;
    padding: 14px 15px 12px;
    transition: border-color .16s ease, transform .16s ease;
  }
  .card:hover { border-color: var(--line); transform: translateY(-2px); }
  .card.read { opacity: 0.45; }

  .top { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 9px; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; min-width: 0; }

  .tag {
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em;
    padding: 2px 6px; border-radius: 4px;
    border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  }
  .tag.bid { border-color: rgba(92, 124, 255, .4); color: #93a8ff; }
  .tag.pre { border-color: rgba(240, 169, 59, .4); color: var(--amber); }
  .tag.new { border-color: rgba(63, 214, 154, .45); color: var(--fresh); }

  .star {
    background: none; border: 0; cursor: pointer; padding: 0 2px;
    font-size: 16px; line-height: 1; color: var(--dim);
  }
  .star:hover { color: var(--muted); }
  .star[aria-pressed="true"] { color: var(--amber); }
  .star:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

  .title {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; padding: 0; cursor: pointer;
    font-family: var(--sans); font-size: 15px; font-weight: 700;
    letter-spacing: -0.022em; line-height: 1.4; color: var(--text);
    word-break: keep-all; margin-bottom: 8px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .title:hover { color: #a8bcff; }
  .title:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }

  .org { font-size: 12.5px; color: var(--muted); margin-bottom: 3px; }
  .amt { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .amt b { color: var(--text); font-weight: 700; }

  .foot {
    display: flex; align-items: center; gap: 8px;
    margin-top: auto; padding-top: 11px;
    border-top: 1px solid var(--line-soft);
  }

  .dday {
    font-size: 15px; font-weight: 800; letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums; color: var(--muted);
  }
  .card[data-heat="hot"] .dday { color: var(--hot); }
  .card[data-heat="warm"] .dday { color: var(--amber); }
  .card[data-heat="ok"] .dday { color: var(--text); }

  .clock { font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }

  .done {
    margin-left: auto;
    background: none; border: 1px solid var(--line); border-radius: 6px;
    color: var(--muted); cursor: pointer;
    font-family: var(--sans); font-size: 11.5px; font-weight: 600; padding: 4px 9px;
  }
  .done:hover { color: var(--text); border-color: var(--muted); }
  .done:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ---------- 알림 토스트 ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: var(--panel-hi); border: 1px solid var(--line); border-radius: 9px;
    padding: 11px 18px; font-size: 13.5px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
    z-index: 50; box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
  }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- 빈 화면 ---------- */
  .empty { padding: 70px 0; text-align: center; color: var(--muted); }
  .empty p { margin: 0 0 6px; font-size: 15px; font-weight: 600; color: var(--text); }
  .empty small { font-size: 13px; }

  @media (max-width: 560px) {
    .wrap { padding: 0 16px; }
    .masthead { padding: 28px 0 18px; }
    .masthead h1 { font-size: 24px; }
    .grid { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <p class="eyebrow">나라장터 · 용역 + 사전규격</p>
    <h1>영상 공고 감시대</h1>
    <p class="stamp" id="stamp">불러오는 중…</p>
    <div class="tally">
      <div class="t-new"><b id="cNew">0</b><span>안 읽음</span></div>
      <div class="t-hot"><b id="cHot">0</b><span>3일 내 마감</span></div>
      <div><b id="cLive">0</b><span>진행 중</span></div>
      <div><b id="cKeep">0</b><span>관심</span></div>
    </div>
  </div>
</header>

<div class="controls">
  <div class="wrap">
    <input id="q" type="search" placeholder="공고명·기관 검색" autocomplete="off" />
    <div class="seg" id="fKind">
      <button data-v="all" aria-pressed="true">전체</button>
      <button data-v="bid" aria-pressed="false">입찰</button>
      <button data-v="prespec" aria-pressed="false">사전규격</button>
    </div>
    <div class="seg" id="fView">
      <button data-v="live" aria-pressed="true">진행 중</button>
      <button data-v="unread" aria-pressed="false">안 읽음</button>
      <button data-v="keep" aria-pressed="false">관심</button>
      <button data-v="all" aria-pressed="false">전부</button>
    </div>
  </div>
</div>

<main class="wrap" id="list"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const KEY = "g2b-video-watch";
const G2B = "https://www.g2b.go.kr/";
const state = { kind: "all", view: "live", q: "" };
let notices = [];
let marks = load();

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(marks)); }
function mark(id) { return marks[id] || (marks[id] = {}); }

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 2600);
}

/* 나라장터 개편 이후 API가 상세 링크 대신 메인 주소만 주는 경우가 많습니다.
   그런 경우엔 공고번호를 복사해 검색으로 찾도록 안내합니다. */
function realLink(n) {
  const u = (n.url || "").trim();
  if (!u) return "";
  if (/^https?:\/\/(www\.)?g2b\.go\.kr\/?$/i.test(u)) return "";
  return u;
}

function openNotice(n) {
  const link = realLink(n);
  if (link) { window.open(link, "_blank", "noopener"); return; }

  const no = (n.no || "").split("-")[0];
  const go = () => window.open(G2B, "_blank", "noopener");

  if (navigator.clipboard && no) {
    navigator.clipboard.writeText(no)
      .then(() => toast(`공고번호 ${no} 복사됨 · 나라장터 검색창에 붙여넣으세요`))
      .catch(() => toast(`공고번호 ${no} · 나라장터에서 검색하세요`))
      .finally(go);
  } else {
    toast(`공고번호 ${no} · 나라장터에서 검색하세요`);
    go();
  }
}

function daysLeft(iso) {
  if (!iso) return null;
  const t = new Date(iso).getTime();
  if (isNaN(t)) return null;
  return Math.floor((t - Date.now()) / 86400000);
}

function heat(d) {
  if (d === null) return "none";
  if (d < 0) return "dead";
  if (d <= 2) return "hot";
  if (d <= 6) return "warm";
  return "ok";
}

function money(w) {
  if (!w) return "";
  if (w >= 1e8) return (w / 1e8).toFixed(1).replace(/\.0$/, "") + "억원";
  return Math.round(w / 1e4).toLocaleString() + "만원";
}

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

const BANDS = [
  { label: "오늘·내일 마감", test: d => d !== null && d >= 0 && d <= 1, urgent: true },
  { label: "이번 주 안에", test: d => d !== null && d >= 2 && d <= 6 },
  { label: "여유 있음", test: d => d !== null && d >= 7 },
  { label: "마감일 미표기", test: d => d === null },
  { label: "마감됨", test: d => d !== null && d < 0 },
];

function visible() {
  const q = state.q.trim().toLowerCase();
  return notices.filter(n => {
    const d = daysLeft(n.close_at);
    if (state.kind !== "all" && n.kind !== state.kind) return false;
    if (state.view === "live" && d !== null && d < 0) return false;
    if (state.view === "unread" && mark(n.id).read) return false;
    if (state.view === "keep" && !mark(n.id).keep) return false;
    if (q && !(n.title + n.org).toLowerCase().includes(q)) return false;
    return true;
  });
}

function card(n) {
  const d = daysLeft(n.close_at);
  const m = mark(n.id);
  const el = document.createElement("article");
  el.className = "card" + (m.read ? " read" : "");
  el.dataset.heat = heat(d);

  const dText = d === null ? "—" : d < 0 ? "마감" : "D-" + d;

  el.innerHTML = `
    <div class="top">
      <div class="tags">
        <span class="tag ${n.kind === "prespec" ? "pre" : "bid"}">${n.kind === "prespec" ? "사전규격" : "입찰공고"}</span>
        ${!m.read ? '<span class="tag new">안 읽음</span>' : ""}
        ${(n.hits || []).slice(0, 1).map(k => `<span class="tag">${k}</span>`).join("")}
      </div>
      <button class="star" data-act="keep" aria-pressed="${!!m.keep}" title="관심 등록">${m.keep ? "★" : "☆"}</button>
    </div>
    <button class="title" data-act="open">${n.title}</button>
    <div class="org">${n.org || "기관 미상"}</div>
    <div class="amt">${n.budget ? `<b>${money(n.budget)}</b>` : "금액 미공개"}${n.method ? " · " + n.method : ""}</div>
    <div class="foot">
      <span class="dday">${dText}</span>
      <span class="clock">${fmtDate(n.close_at) || "마감일 미정"}</span>
      <button class="done" data-act="read">${m.read ? "되돌리기" : "읽음"}</button>
    </div>`;

  el.querySelector('[data-act="open"]').onclick = () => {
    if (!m.read) { m.read = true; save(); }
    openNotice(n);
    render();
  };
  el.querySelector('[data-act="keep"]').onclick = () => { m.keep = !m.keep; save(); render(); };
  el.querySelector('[data-act="read"]').onclick = () => { m.read = !m.read; save(); render(); };
  return el;
}

function render() {
  const list = document.getElementById("list");
  list.textContent = "";
  const rows = visible();

  if (!rows.length) {
    list.innerHTML = `<div class="empty"><p>조건에 맞는 공고가 없습니다.</p>
      <small>검색어를 지우거나 필터를 '전부'로 바꿔보세요.</small></div>`;
  } else {
    BANDS.forEach(b => {
      const group = rows.filter(n => b.test(daysLeft(n.close_at)));
      if (!group.length) return;
      const h = document.createElement("div");
      h.className = "band" + (b.urgent ? " urgent" : "");
      h.innerHTML = `${b.label} <em>${group.length}</em>`;
      list.appendChild(h);
      const g = document.createElement("div");
      g.className = "grid";
      group.forEach(n => g.appendChild(card(n)));
      list.appendChild(g);
    });
  }

  const live = notices.filter(n => { const d = daysLeft(n.close_at); return d === null || d >= 0; });
  document.getElementById("cNew").textContent = live.filter(n => !mark(n.id).read).length;
  document.getElementById("cHot").textContent = live.filter(n => { const d = daysLeft(n.close_at); return d !== null && d <= 2; }).length;
  document.getElementById("cLive").textContent = live.length;
  document.getElementById("cKeep").textContent = notices.filter(n => mark(n.id).keep).length;
}

function wireSeg(id, field) {
  const box = document.getElementById(id);
  box.addEventListener("click", e => {
    const btn = e.target.closest("button");
    if (!btn) return;
    [...box.children].forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    state[field] = btn.dataset.v;
    render();
  });
}
wireSeg("fKind", "kind");
wireSeg("fView", "view");

document.getElementById("q").addEventListener("input", e => {
  state.q = e.target.value;
  render();
});

fetch("data/notices.json?v=" + Date.now())
  .then(r => r.json())
  .then(d => {
    notices = d.notices || [];
    document.getElementById("stamp").textContent =
      "마지막 수집 " + fmtDate(d.updated_at) + " · 누적 " + notices.length + "건";
    render();
  })
  .catch(() => {
    document.getElementById("stamp").textContent = "데이터를 불러오지 못했습니다";
    document.getElementById("list").innerHTML =
      `<div class="empty"><p>아직 수집된 공고가 없습니다.</p>
       <small>Actions 탭에서 '영상 공고 수집'을 한 번 실행해 주세요.</small></div>`;
  });
</script>
</body>
</html>
