name: 영상 공고 수집

on:
  schedule:
    - cron: "30 23 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: g2b-watch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: 공고 수집
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          G2B_PRESPEC_SERVICE_KEY: ${{ secrets.G2B_PRESPEC_SERVICE_KEY }}
        run: python scripts/collect.py

      - name: 카카오톡 알림
        continue-on-error: true
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/notify_kakao.py

      - name: 카카오 토큰 자동 갱신
        if: ${{ hashFiles('new_refresh_token.txt') != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            gh secret set KAKAO_REFRESH_TOKEN --body "$(cat new_refresh_token.txt)"
          else
            echo "::warning::새 카카오 리프레시 토큰이 발급되었습니다. 시크릿을 직접 갱신하세요."
          fi

      # 수집한 결과만 따로 빼둔 뒤 최신 창고 위에 얹어 저장합니다.
      # 중간에 파일을 고쳤거나 예전 시점에서 실행돼도 충돌 없이 저장됩니다.
      - name: 결과 저장
        run: |
          rm -f new_items.json new_refresh_token.txt
          cp docs/data/notices.json /tmp/notices.json

          git config user.name "g2b-watch"
          git config user.email "actions@github.com"
          git fetch origin main
          git reset --hard origin/main

          mkdir -p docs/data
          cp /tmp/notices.json docs/data/notices.json
          git add docs/data/notices.json

          if git diff --staged --quiet; then
            echo "바뀐 공고가 없어 저장을 건너뜁니다."
          else
            git commit -m "공고 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
